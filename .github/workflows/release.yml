name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: tar.gz
          - os: linux
            arch: arm64
            ext: tar.gz
          - os: darwin
            arch: amd64
            ext: tar.gz
          - os: darwin
            arch: arm64
            ext: tar.gz
          - os: windows
            arch: amd64
            ext: zip
          - os: windows
            arch: arm64
            ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build archive
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          MATRIX_EXT: ${{ matrix.ext }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN="sacr"
          [ "$GOOS" = "windows" ] && BIN="sacr.exe"

          STAGE="$(mktemp -d)"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.GitCommit=${COMMIT} -X main.BuildDate=${DATE}" \
            -o "${STAGE}/${BIN}" ./cmd/sacr

          # Include LICENSE + NOTICE alongside the binary — mandatory for
          # Apache-2.0 redistribution.
          cp LICENSE NOTICE README.md "${STAGE}/"

          ARCHIVE="sacr_${VERSION}_${GOOS}_${GOARCH}.${MATRIX_EXT}"
          if [ "$MATRIX_EXT" = "zip" ]; then
            (cd "$STAGE" && zip -qr "${GITHUB_WORKSPACE}/${ARCHIVE}" .)
          else
            tar -C "$STAGE" -czf "${ARCHIVE}" .
          fi
          sha256sum "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: sacr-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha_darwin_arm64: ${{ steps.checksums.outputs.darwin_arm64 }}
      sha_darwin_amd64: ${{ steps.checksums.outputs.darwin_amd64 }}
      sha_linux_arm64: ${{ steps.checksums.outputs.linux_arm64 }}
      sha_linux_amd64: ${{ steps.checksums.outputs.linux_amd64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Meta
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Aggregate checksums
        id: checksums
        working-directory: dist
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          : > sha256sum.txt
          for f in sacr_*; do
            case "$f" in
              *.sha256) continue ;;
            esac
            [ -f "$f" ] || continue
            sha256sum "$f" >> sha256sum.txt
          done
          echo "== sha256sum.txt =="
          cat sha256sum.txt

          extract_sha() {
            awk -v pat="$1" '$2 == pat { print $1 }' sha256sum.txt
          }
          echo "darwin_arm64=$(extract_sha "sacr_${VERSION}_darwin_arm64.tar.gz")" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(extract_sha "sacr_${VERSION}_darwin_amd64.tar.gz")" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(extract_sha "sacr_${VERSION}_linux_arm64.tar.gz")" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(extract_sha "sacr_${VERSION}_linux_amd64.tar.gz")" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/sacr_*
            dist/sha256sum.txt

      - name: Release notes
        id: notes
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"
          notes_file="$(mktemp)"
          {
            echo "## ${CURRENT_TAG}"
            echo
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release."
            else
              echo "**Changes**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
              echo
              git log --oneline --no-merges "${PREV_TAG}..${CURRENT_TAG}" | sed 's/^/- /'
            fi
            echo
            echo "### Install"
            echo
            echo '```sh'
            echo "brew install shubam-disseqt/tap/sacr"
            echo "npm i -g sacr"
            echo '```'
          } > "$notes_file"
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/sacr_*
            dist/sha256sum.txt
          fail_on_unmatched_files: true

  npm-publish:
    name: publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Guard on NPM_TOKEN
        id: guard
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN not set; skipping npm publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version
        if: steps.guard.outputs.skip == 'false'
        working-directory: packaging/npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Publish
        if: steps.guard.outputs.skip == 'false'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  homebrew-bump:
    name: bump homebrew tap
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Guard on HOMEBREW_TAP_TOKEN
        id: guard
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping tap bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tap
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: shubam-disseqt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.guard.outputs.skip == 'false'
        working-directory: tap
        env:
          VERSION: ${{ needs.release.outputs.version }}
          SHA_DARWIN_ARM64: ${{ needs.release.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ needs.release.outputs.sha_darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ needs.release.outputs.sha_linux_arm64 }}
          SHA_LINUX_AMD64: ${{ needs.release.outputs.sha_linux_amd64 }}
        run: |
          set -euo pipefail
          FORMULA="Formula/sacr.rb"
          if [ ! -f "$FORMULA" ]; then
            echo "::error::$FORMULA missing in tap repo — bootstrap it first (see packaging/homebrew/README.md)."
            exit 1
          fi
          # Replace either the placeholder tokens (first release) or the
          # previous version/sha lines (subsequent releases).
          python3 - "$FORMULA" <<'PY'
          import os, re, sys
          path = sys.argv[1]
          src = open(path).read()

          version = os.environ["VERSION"]
          shas = {
              "darwin_arm64": os.environ["SHA_DARWIN_ARM64"],
              "darwin_amd64": os.environ["SHA_DARWIN_AMD64"],
              "linux_arm64":  os.environ["SHA_LINUX_ARM64"],
              "linux_amd64":  os.environ["SHA_LINUX_AMD64"],
          }

          # version line
          src = re.sub(r'version\s+"[^"]+"', f'version "{version}"', src, count=1)

          # Each url/sha block is anchored by its filename suffix. Rewrite the
          # sha256 that follows each matching url.
          def replace_block(text, suffix, sha):
              pattern = re.compile(
                  r'(url\s+"[^"]*_' + re.escape(suffix) + r'\.tar\.gz"\s*\n\s*sha256\s+")[0-9a-fA-F]{64}(")',
                  re.MULTILINE,
              )
              return pattern.sub(lambda m: m.group(1) + sha + m.group(2), text)

          for suffix, sha in shas.items():
              src = replace_block(src, suffix, sha)

          # First-release placeholders
          src = src.replace("RELEASE_VERSION", version)
          for suffix, sha in shas.items():
              src = src.replace(f"RELEASE_SHA256_{suffix.upper()}", sha)

          open(path, "w").write(src)
          PY

          git config user.name "sacr-release-bot"
          git config user.email "sacr-release-bot@users.noreply.github.com"
          BRANCH="bump-sacr-${VERSION}"
          git checkout -b "$BRANCH"
          git add "$FORMULA"
          git commit -m "sacr ${VERSION}"
          git push origin "$BRANCH"

      - name: Open PR against tap
        if: steps.guard.outputs.skip == 'false'
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          gh pr create \
            --title "sacr ${VERSION}" \
            --body "Automated bump from https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --head "bump-sacr-${VERSION}" \
            --base main
