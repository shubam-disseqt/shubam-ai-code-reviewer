name: Deploy docs-site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docs-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Prepare static export
        run: |
          # Fumadocs on Next.js: `next build` produces the .next dir.
          # For GitHub Pages we need a static export. If Next config
          # already sets `output: 'export'`, the `out/` dir is emitted
          # by `next build` directly. Otherwise fall back to serving
          # the .next standalone bundle via a static host (Vercel).
          if [ -d out ]; then
            echo "static export detected"
          else
            echo "::warning::No static export. Configure Next.js output:'export' for GitHub Pages, or deploy to Vercel."
            mkdir -p out
            echo "See docs-site/README.md for deployment options." > out/index.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
