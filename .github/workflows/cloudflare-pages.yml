name: Deploy docs to Cloudflare Pages

# The `docs/` directory doubles as source for two surfaces:
#   1. The offline docs viewer shipped in the binary — served by
#      `zreview docs` from the `//go:embed *.html *.css` in `docs/embed.go`.
#   2. The online copy at https://z-code-reviewer.pages.dev/, deployed
#      by this workflow to Cloudflare Pages (works with private repos,
#      free tier).
# One source of truth. Any HTML/CSS edit under `docs/` updates both.
#
# One-time setup (see docs/deployment.html for the full walkthrough):
#   1. Create a free Cloudflare account.
#   2. Create the Pages project once:
#        npx wrangler pages project create z-code-reviewer \
#          --production-branch=main
#   3. Add two repo secrets:
#        CLOUDFLARE_API_TOKEN   — token with "Cloudflare Pages: Edit"
#        CLOUDFLARE_ACCOUNT_ID  — from the dashboard sidebar
#   4. Push to main touching docs/ — this workflow deploys.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Skip cleanly until the operator flips CLOUDFLARE_PAGES_ENABLED=true
    # in repo variables. Secrets can't be referenced in job-level `if:`,
    # so we use a repo var as the on/off switch.
    if: ${{ vars.CLOUDFLARE_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://z-code-reviewer.pages.dev/
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs --project-name=z-code-reviewer --branch=main --commit-dirty=true
