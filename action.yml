# SPDX-License-Identifier: Apache-2.0
name: sacr
description: AI-powered PR review — inline comments, effort score, depgraph
author: shubam-disseqt
branding:
  icon: check-circle
  color: purple

inputs:
  pr-number:
    description: Pull request number
    required: true
  provider:
    description: LLM provider (anthropic|openai|bedrock|deepseek)
    required: false
    default: openai
  model:
    description: Main-tier model
    required: false
    default: gpt-4o-mini
  cheap-model:
    description: Cheap-tier model (defaults to main-tier if unset)
    required: false
    default: ''
  api-key:
    description: LLM API key (routed to the provider's env var)
    required: true
  github-token:
    description: GITHUB_TOKEN with PR write access
    required: true
  min-severity:
    description: Drop findings below this bucket (LOW|MEDIUM|HIGH|CRITICAL)
    required: false
    default: MEDIUM
  format:
    description: Output format (stdout|json|github|sarif)
    required: false
    default: github
  image:
    description: Override the sacr image (tag or full ref)
    required: false
    default: ghcr.io/shubam-disseqt/sacr:latest

runs:
  using: composite
  steps:
    - name: Route API key to provider env var
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.provider }}" in
          openai)    echo "OPENAI_API_KEY=${{ inputs.api-key }}"        >> "$GITHUB_ENV" ;;
          anthropic) echo "ANTHROPIC_API_KEY=${{ inputs.api-key }}"     >> "$GITHUB_ENV" ;;
          deepseek)  echo "DEEPSEEK_API_KEY=${{ inputs.api-key }}"      >> "$GITHUB_ENV" ;;
          bedrock)   echo "AWS_BEARER_TOKEN_BEDROCK=${{ inputs.api-key }}" >> "$GITHUB_ENV" ;;
          *) echo "::error::unknown provider '${{ inputs.provider }}'"; exit 1 ;;
        esac

    - name: Run sacr via Docker
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        SACR_PROVIDER: ${{ inputs.provider }}
        SACR_MODEL: ${{ inputs.model }}
        SACR_CHEAP_MODEL: ${{ inputs.cheap-model }}
      run: |
        set -euo pipefail
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -w /workspace \
          -e OPENAI_API_KEY -e ANTHROPIC_API_KEY -e DEEPSEEK_API_KEY \
          -e AWS_BEARER_TOKEN_BEDROCK -e AWS_REGION \
          -e GITHUB_TOKEN -e GITHUB_REPOSITORY \
          -e SACR_PROVIDER -e SACR_MODEL -e SACR_CHEAP_MODEL \
          "${{ inputs.image }}" \
          review \
            --pr "${{ inputs.pr-number }}" \
            --format "${{ inputs.format }}" \
            --min-severity "${{ inputs.min-severity }}"
